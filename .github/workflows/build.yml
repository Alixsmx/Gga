name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        run: |
          mkdir /tmp/src
          unzip -q "$(ls *.zip | head -1)" -d /tmp/src
          cd "$(dirname "$(find /tmp/src -name settings.gradle.kts | head -1)")"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GlassTube.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: GlassTube-APK
          path: GlassTube.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GlassTube (najnowszy APK)
          files: GlassTube.apk
